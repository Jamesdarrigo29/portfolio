<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>James Darrigo — Full Stack Software Engineer</title>
    <meta
      name="description"
      content="James Darrigo is a Full Stack Software Engineer with 5+ years of experience building scalable web applications and APIs with PHP, Symfony, Laravel, React, Next.js, and Python/Django."
    />
    <meta name="author" content="James Darrigo" />
    <meta name="theme-color" content="#080b12" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="James Darrigo — Full Stack Software Engineer" />
    <meta
      property="og:description"
      content="Full Stack Software Engineer with 5+ years of experience building scalable web applications and APIs with PHP, Symfony, Laravel, React, Next.js, and Python/Django."
    />
    <meta property="og:image" content="/og-image.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="James Darrigo — Full Stack Software Engineer" />
    <meta
      name="twitter:description"
      content="Full Stack Software Engineer with 5+ years of experience building scalable web applications and APIs with PHP, Symfony, Laravel, React, Next.js, and Python/Django."
    />
    <meta name="twitter:image" content="/og-image.png" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Applied before paint so the correct theme renders on first frame (no flash).
      (function () {
        var stored = localStorage.getItem('theme');
        var isDark = stored ? stored === 'dark' : true; // dark-mode-first default
        document.documentElement.classList.toggle('dark', isDark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
